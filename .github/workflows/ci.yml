# Backend CI — for the dsavisualizer repo (backend only).
# Place this file at .github/workflows/ci.yml in that repo.
#
# The backend files live at the repo ROOT (pom.xml, src/,
# Dockerfile), so there is no `backend/` folder and no
# working-directory here.
#
# The old monorepo workflow failed for two reasons:
# 1. It ran `mvn verify` inside a `backend/` directory that does
#    not exist in this repo (pom.xml is at the root), so the
#    "Build and test" step failed.
# 2. It also ran a frontend job for a `frontend/` directory that
#    is not in this repo either.
#
# This workflow also triggers on `dev` and `stage`, not just
# `main` — the repo's default branch is `dev`, so a workflow
# that only triggers on `main` never runs on the branch Babu
# actually pushes to.

name: CI

on:
  push:
    branches: [main, dev, stage]
  pull_request:
    branches: [main, dev, stage]

jobs:
  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven
      - name: Build and test
        run: mvn -B -q verify

  # Deployment is handled by Render, not by this workflow:
  # connect the repo at render.com (Root Directory: blank, Language:
  # Docker). It rebuilds on every push. This workflow is the gate:
  # if the build or tests fail here, the push is red.
